<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">假回锁 · BL Flasher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="page-shell">
  <header class="toolbar">
    <div class="identity"><h1>BL Flasher</h1><span class="version" id="moduleVersion">—</span></div>
    <div class="toolbar-actions">
      <span class="chip" id="stateChip" role="status">等待检测</span>
      <button class="ghost-button" id="refreshButton" type="button" data-i18n="refresh">刷新</button>
    </div>
  </header>
  <main class="grid-layout">
    <section class="summary" aria-labelledby="lblSlotStatus">
      <h2 class="sr-only" id="lblSlotStatus">槽位状态</h2>
      <dl class="task-summary">
        <div class="task-stat"><dt id="lblTaskStatus">任务状态</dt><dd id="taskMessage" role="status">等待操作</dd></div>
      </dl>
    </section>
    <section class="panel patch-panel">
      <div class="panel-heading"><h2 data-i18n="patchPanel">分区修补</h2></div>
      <label class="option-check" for="patchVendorBootCheckbox">
        <input id="patchVendorBootCheckbox" type="checkbox" />
        <span id="lblPatchVendorBoot">禁用安全模块</span>
      </label>

      <label class="option-check" for="patchSuperCheckbox">
        <input id="patchSuperCheckbox" type="checkbox" disabled />
        <span id="lblPatchSuper">同时替换挂载配置</span>
      </label>

      <div class="action-strip"><button class="primary-button" id="patchPartButton" type="button" data-i18n="patchPart" disabled>修补 vendor_boot</button></div>


    </section>

    <section class="panel ota-panel">
      <div class="panel-heading"><h2 data-i18n="otaPanel">OTA 与启动维护</h2></div>
      <label class="option-check" for="updateEfispCheckbox">
        <input id="updateEfispCheckbox" type="checkbox" checked />
        <span id="lblUpdateEfisp">更新 efisp（默认开启）</span>
      </label>

      <div class="action-strip">
        <button class="primary-button" id="flashButton" type="button" disabled data-i18n="flash">刷写到另一槽位</button>
        <button class="ghost-button" id="bdsToolsButton" type="button" disabled data-i18n="bdsTools">仅更新BDS和Tools</button>
      </div>

    </section>
    <aside class="operation-notes">
      <label class="option-check" for="debugModeCheckbox">
        <input id="debugModeCheckbox" type="checkbox" />
        <span id="lblDebugMode">调试模式</span>
      </label>
    </aside>
    <section class="panel map-panel">
      <div class="panel-heading">
        <h2 id="lblImageMap">镜像映射</h2>
        <span class="caption" id="updatedAt">—</span>
      </div>
      <div class="table-wrap" tabindex="0" role="region" aria-labelledby="lblImageMap">
        <table>
          <thead>
            <tr>
              <th scope="col" id="tblPartition">分区名</th>
              <th scope="col" id="tblSource">源分区 (当前槽位)</th>
              <th scope="col" id="tblTarget">目标分区</th>
              <th scope="col" id="tblAction">操作</th>
            </tr>
          </thead>
          <tbody id="imageTableBody">
            <tr>
              <td colspan="4" class="empty-row" id="tblWaiting">等待读取模块状态</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="panel log-panel">
      <div class="panel-heading">
        <div class="heading-group"><h2 id="lblLog">实时日志</h2></div>
        <button class="ghost-button" id="clearLogButton" type="button" data-i18n="clearLog">清空日志</button>
      </div>
      <pre id="logOutput" tabindex="0" aria-labelledby="lblLog">等待日志输出...</pre>
    </section>
  </main>
</div>

<div class="modal-backdrop hidden" id="confirmModal" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="confirmText">
    <p class="risk-label" id="modalRisk">高风险操作</p>
    <h2 id="modalTitle">确认刷写</h2>
    <p id="confirmText">即将开始刷写，请确认操作对象和槽位。</p>
    <dl class="stats-grid hidden" id="confirmSlots">
        <div><dt id="lblCurrentSlot">当前槽位</dt><dd id="currentSlot">—</dd></div>
        <div><dt id="lblTargetSlot">目标槽位</dt><dd id="targetSlot">—</dd></div>
        <div><dt id="lblImageCount">镜像数量</dt><dd id="imageCount">—</dd></div>
    </dl>
    <p class="caption hidden" id="debugHint"></p>
    <div class="modal-actions">
      <button class="ghost-button" id="cancelConfirmButton" type="button" data-i18n="cancel">取消</button>
      <button class="primary-button" id="nextConfirmButton" type="button" data-i18n="continue">继续</button>
    </div>
  </div>
</div>

<dialog id="taskDialog" aria-labelledby="taskDialogTitle" aria-describedby="taskDialogMessage">
  <div class="task-heading"><span id="taskSpinner" class="task-spinner" aria-hidden="true"></span><h2 id="taskDialogTitle">正在启动</h2></div>
  <p id="taskDialogContext" class="caption"></p>
  <p id="taskDialogMessage" role="status" aria-live="polite"></p>
  <p id="taskDialogError" role="alert"></p>
  <pre id="taskDialogLog" tabindex="0" aria-label="实时日志"></pre>
  <div class="modal-actions"><button id="taskRetryButton" class="ghost-button" type="button">刷新状态</button><button id="taskCloseButton" class="primary-button" type="button" disabled>完成</button></div>
</dialog>
<script type="module" src="app.js"></script>
</body>
</html>
